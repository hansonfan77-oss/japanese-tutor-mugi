name: Mugi validation
on:
  push:
    branches: [main, feat/mugi-private-pwa-animation]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MUGI_DATA_DIR: ${{ runner.temp }}/mugi-test-account
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: node --test scripts/test-production.mjs
      - name: Runtime logic and parser on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ./scripts/windows/Test-Runtime.ps1'
      - name: Runtime logic and parser on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./scripts/windows/Test-Runtime.ps1'
